[project]
name = "livebridge"
version = "0.1.0"
description = "Drive Ableton Live 12 from tests and from Claude, through the NoteCapBridge Remote Script (from Chordism's LiveBridge)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
